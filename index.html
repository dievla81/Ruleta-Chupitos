<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de la Fortuna - Encuentro de Amigos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1 style="display:none;">Ruleta de la Fortuna</h1>


        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div id="wheel" class="wheel"></div>
            <div class="center-logo"></div>
        </div>


        <button id="spin-button">GIRA LA RULETA</button>

        <div id="result-modal" class="modal">
            <div class="modal-content">
                <div class="card-logo"></div>
                <div class="card-body">
                    <h2 id="slot-name">Casilla</h2>
                    <p id="slot-action">Acción</p>
                </div>
                <button id="close-modal">Continuar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
